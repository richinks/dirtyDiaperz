<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dirty Diapers — Song Production Database</title>
    <style>
        :root {
            --bg-color: #121214;
            --surface-color: #1e1e24;
            --surface-hover: #2a2a35;
            --text-primary: #f1f1f3;
            --text-secondary: #a0a0ab;
            --accent-color: #e54b4b;
            --accent-hover: #ff5c5c;
            --border-color: #2e2e38;
            --badge-high: #2e7d32;
            --badge-medium: #ed6c02;
            --badge-low: #757575;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            line-height: 1.5;
            padding: 16px;
        }

        #app {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-bottom: 20px;
        }

        @media (min-width: 768px) {
            header {
                flex-direction: row;
                justify-content: space-between;
                align-items: center;
            }
        }

        h1 {
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .header-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        input[type="text"] {
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-primary);
            padding: 10px 14px;
            font-size: 1rem;
            outline: none;
            width: 100%;
            transition: border-color 0.2s;
        }

        @media (min-width: 768px) {
            input[type="text"] {
                width: 300px;
            }
        }

        input[type="text"]:focus {
            border-color: var(--accent-color);
        }

        .btn {
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            font-size: 0.9rem;
            transition: background-color 0.2s, border-color 0.2s;
        }

        .btn:hover {
            background-color: var(--surface-hover);
        }

        .btn.primary {
            background-color: var(--accent-color);
            border-color: var(--accent-color);
        }

        .btn.primary:hover {
            background-color: var(--accent-hover);
        }

        .stats-bar {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .stat-card {
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .stat-card.warning {
            border-left: 4px solid var(--badge-medium);
        }

        .stat-value {
            font-size: 1.4rem;
            font-weight: 700;
        }

        .stat-label {
            font-size: 0.7rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .table-container {
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.9rem;
            white-space: nowrap;
        }

        th, td {
            padding: 12px 14px;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            background-color: rgba(255, 255, 255, 0.02);
            font-weight: 600;
            color: var(--text-secondary);
            cursor: pointer;
            user-select: none;
        }

        th:hover {
            color: var(--text-primary);
        }

        tbody tr {
            transition: background-color 0.15s;
            cursor: pointer;
        }

        tbody tr:hover {
            background-color: var(--surface-hover);
        }

        tbody tr:last-child td {
            border-bottom: none;
        }

        .badge {
            display: inline-block;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
        }

        .badge.high { background-color: var(--badge-high); color: #fff; }
        .badge.medium { background-color: var(--badge-medium); color: #fff; }
        .badge.low { background-color: var(--badge-low); color: #fff; }

        /* Modal Styles */
        .modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 16px;
        }

        .modal-content {
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            width: 100%;
            max-width: 600px;
            max-height: 90vh;
            overflow-y: auto;
            padding: 20px;
            position: relative;
        }

        .close-btn {
            position: absolute;
            top: 16px; right: 16px;
            background: none; border: none;
            color: var(--text-secondary);
            font-size: 1.5rem;
            cursor: pointer;
        }

        .close-btn:hover { color: var(--text-primary); }

        .subtitle {
            color: var(--text-secondary);
            margin-bottom: 16px;
            font-size: 0.95rem;
        }

        .modal-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            background: rgba(0,0,0,0.2);
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 0.9rem;
        }

        #modal-cues-list {
            list-style-type: none;
            margin-top: 8px;
            max-height: 150px;
            overflow-y: auto;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 8px;
        }

        #modal-cues-list li {
            padding: 4px 8px;
            font-size: 0.85rem;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .modal-footer {
            margin-top: 20px;
            display: flex;
            justify-content: flex-end;
        }
    </style>
</head>

                    <tbody id="songs-tbody">

                    </tbody>
                </table>
            </section>
        </main>

        <!-- Song Details Modal -->
        <div id="detail-modal" class="modal" style="display: none;">

                    <div><strong>Length:</strong> <span id="modal-length"></span></div>
                    <div><strong>Confidence:</strong> <span id="modal-conf"></span></div>

                <h3>Timeline Cues &amp; Source Notes</h3>
                <ul id="modal-cues-list"></ul>

                <div class="modal-footer">
                    <button class="btn primary close-modal-action">Close</button>
                </div>
            </div>
        </div>
    </div>

            { title: "Stairway to Heaven", artist: "Led Zeppelin", bpm: 71, key: "A min", length: "8:02", cues: 15, conf: "HIGH", cueNotes: ["Tempo naturally accelerates from ~71 to ~102 BPM across song (requires tempo ramp)", "Acoustic intro to heavy outro"] },

            { title: "Who Are You", artist: "The Who", bpm: 156, key: "A maj", length: "6:22", cues: 9, conf: "LOW", cueNotes: ["Synthesizer sequencer rhythm bed", "Heavy drum breakdown accents"] },
            { title: "Wish You Were Here", artist: "Pink Floyd", bpm: 122, key: "G maj", length: "5:21", cues: 8, conf: "LOW", cueNotes: ["Radio filter acoustic intro", "Singalong acoustic ballad layout"] },
            { title: "Won't Back Down", artist: "Tom Petty", bpm: 114, key: "G maj", length: "2:58", cues: 10, conf: "MEDIUM", cueNotes: ["Stomp-and-clap acoustic rhythm bed", "Anthemic chorus power chords"] },
            { title: "Yellow Ledbetter", artist: "Pearl Jam", bpm: 71, key: "E maj", length: "5:04", cues: 6, conf: "LOW", cueNotes: ["Hendrix-style clean blues ballad feel", "Slow spacious tempo"] },
            { title: "You Shook Me All Night Long", artist: "AC/DC", bpm: 128, key: "G maj", length: "3:32", cues: 7, conf: "LOW", cueNotes: ["Classic opening guitar riff", "Driving hard rock rhythm"] },
            { title: "Zombie", artist: "The Cranberries", bpm: 84, key: "E min", length: "5:06", cues: 7, conf: "MEDIUM", cueNotes: ["Full vs half-time tempo choice required", "Heavy grunge distortion contrast"] }
        ];

        document.addEventListener('DOMContentLoaded', () => {
            let songsData = JSON.parse(localStorage.getItem('dd_songs_data')) || [...fullSongsData];
            let currentSort = { column: 'title', ascending: true };

            // JSONBin Credentials Pre-configured
            const BIN_ID = '6a85c5bada38895dfef78196';
            const API_KEY = '$2a$10$Qx5EIx9bCnzYeTS/niHQneTsF9ZTx4Fz/x83gIczflv//YDMyxmiC';

            async function syncWithJSONBin() {
                try {
                    const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                        headers: { 'X-Master-Key': API_KEY }
                    });
                    if (res.ok) {
                        const json = await res.json();
                        if (json.record && Array.isArray(json.record) && json.record.length > 0) {
                            songsData = json.record;
                            saveData(false);
                            renderTable(songsData);
                        }
                    }
                } catch (err) {
                    console.info('Offline or sync deferred, using local cache.');
                }
            }

            async function pushToJSONBin() {
                try {
                    await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                        method: 'PUT',
                        headers: {
                            'Content-Type': 'application/json',
                            'X-Master-Key': API_KEY
                        },
                        body: JSON.stringify(songsData)
                    });
                } catch (err) {
                    console.warn('Failed to push update to cloud JSONBin.');
                }
            }

            const searchInput = document.getElementById('search-input');
            const songsTbody = document.getElementById('songs-tbody');
            
            const modal = document.getElementById('detail-modal');
            const closeModalBtn = modal.querySelector('.close-btn');
            const closeModalAction = modal.querySelector('.close-modal-action');

            function saveData(syncCloud = true) {
                localStorage.setItem('dd_songs_data', JSON.stringify(songsData));
                document.getElementById('total-songs').textContent = songsData.length;
                if (syncCloud) {
                    pushToJSONBin();
                }
            }

            function renderTable(data) {
                songsTbody.innerHTML = '';
                data.forEach((song) => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td><strong>${escapeHtml(song.title)}</strong></td>
                        <td>${escapeHtml(song.artist)}</td>
                        <td>${song.bpm}</td>
                        <td>${escapeHtml(song.key)}</td>
                        <td>${escapeHtml(song.length)}</td>
                        <td>${song.cues}</td>
                        <td><span class="badge ${song.conf.toLowerCase()}">${song.conf}</span></td>
                    `;
                    tr.addEventListener('click', () => openModal(song));
                    songsTbody.appendChild(tr);
                });
            }

            searchInput.addEventListener('input', (e) => {
                const query = e.target.value.toLowerCase().trim();
                const filtered = songsData.filter(s => 
                    s.title.toLowerCase().includes(query) || 
                    s.artist.toLowerCase().includes(query) || 
                    s.key.toLowerCase().includes(query) ||
                    s.bpm.toString().includes(query) ||
                    s.length.toLowerCase().includes(query) ||
                    s.conf.toLowerCase().includes(query) ||
                    (s.cueNotes && s.cueNotes.some(note => note.toLowerCase().includes(query)))
                );
                renderTable(filtered);
            });

            document.querySelectorAll('th[data-sort]').forEach(th => {
                th.addEventListener('click', () => {
                    const col = th.getAttribute('data-sort');
                    if (currentSort.column === col) {
                        currentSort.ascending = !currentSort.ascending;
                    } else {
                        currentSort.column = col;
                        currentSort.ascending = true;
                    }

                    songsData.sort((a, b) => {
                        let valA = a[col];
                        let valB = b[col];
                        if (typeof valA === 'string') {
                            valA = valA.toLowerCase();
                            valB = valB.toLowerCase();
                        }
                        if (valA < valB) return currentSort.ascending ? -1 : 1;
                        if (valA > valB) return currentSort.ascending ? 1 : -1;
                        return 0;
                    });
                    
                    const query = searchInput.value.toLowerCase().trim();
                    if (query) {
                        searchInput.dispatchEvent(new Event('input'));
                    } else {
                        renderTable(songsData);
                    }
                });
            });

            function openModal(song) {
                document.getElementById('modal-song-title').textContent = song.title;
                document.getElementById('modal-artist-name').textContent = song.artist;
                document.getElementById('modal-bpm').textContent = song.bpm;
                document.getElementById('modal-key').textContent = song.key;
                document.getElementById('modal-length').textContent = song.length;
                document.getElementById('modal-conf').textContent = song.conf;

                const cuesList = document.getElementById('modal-cues-list');
                cuesList.innerHTML = '';
                if (song.cueNotes && song.cueNotes.length > 0) {
                    song.cueNotes.forEach(note => {
                        const li = document.createElement('li');
                        li.textContent = note;
                        cuesList.appendChild(li);
                    });
                } else {
                    const li = document.createElement('li');
                    li.textContent = 'No detailed timeline event notes loaded for this entry.';
                    cuesList.appendChild(li);
                }

                modal.style.display = 'flex';
            }

            closeModalBtn.addEventListener('click', () => modal.style.display = 'none');
            closeModalAction.addEventListener('click', () => modal.style.display = 'none');
            window.addEventListener('click', (e) => { if (e.target === modal) modal.style.display = 'none'; });

            document.getElementById('export-btn').addEventListener('click', () => {
                const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(songsData, null, 2));
                const downloadAnchor = document.createElement('a');
                downloadAnchor.setAttribute("href", dataStr);
                downloadAnchor.setAttribute("download", "dirty_diapers_backup.json");
                document.body.appendChild(downloadAnchor);
                downloadAnchor.click();
                downloadAnchor.remove();
            });

            function escapeHtml(str) {
                return str.toString().replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
            }

            renderTable(songsData);
            document.getElementById('total-songs').textContent = songsData.length;
            syncWithJSONBin();
        });
    </script>
